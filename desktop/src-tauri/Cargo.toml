[package]
name = "kites-markdown"
version = "0.1.0"
description = "Kites Markdown: a reader for Markdown files, opened by double-clicking them"
license = "MIT"
edition = "2021"
# The oldest toolchain this builds with. Cargo's resolver picks dependency versions that support it,
# so a contributor on an older stable toolchain and CI on the newest one build the same lockfile.
rust-version = "1.86"
resolver = "3"
publish = false

[lib]
name = "kites_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
# Tauri 2.12 needs Rust 1.90; the 2.11 line supports the toolchain above.
tauri = { version = "~2.11", features = ["protocol-asset"] }
tauri-plugin-single-instance = "~2.4"
# Used from Rust only (the free function), never registered, so the page gets no opener API.
tauri-plugin-opener = "~2.5"
# Native file and message dialogs, driven from Rust. tauri-plugin-dialog is deliberately not used: it replaces
# window.alert and window.confirm with asynchronous IPC calls, which would make the viewer's
# `if (!confirm(...)) return;` always proceed.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString", "NSURL", "NSError", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "block2", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }
block2 = "0.6"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
