<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kites Markdown app icon: a paper kite on an evening-blue tile. Source of src-tauri/icons/* (pnpm icon). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4E78B8"/>
      <stop offset="0.55" stop-color="#2F4E86"/>
      <stop offset="1" stop-color="#1E3260"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#A9C8F2" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#A9C8F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EEE4"/>
    </linearGradient>
    <linearGradient id="paperShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9E1D2"/>
      <stop offset="1" stop-color="#D9CDB8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6C46A"/>
      <stop offset="1" stop-color="#E9A440"/>
    </linearGradient>
    <linearGradient id="amberShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E39A36"/>
      <stop offset="1" stop-color="#C97B22"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1630" flood-opacity="0.32"/>
    </filter>
    <filter id="kiteShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="18" stdDeviation="14" flood-color="#0B1630" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- Two soft wind lines -->
    <path d="M150 724 C 290 690, 380 742, 520 712" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="10" stroke-linecap="round"/>
    <path d="M610 820 C 700 798, 780 830, 880 806" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Tail: a ribbon with three bows, tied to the kite's lower point and drawn under the kite -->
  <g clip-path="url(#tile)">
  <g transform="translate(-40 0)">
    <path d="M619 682 C 585 740, 659 782, 613 832 S 523 894, 501 944" fill="none" stroke="#F7EFE0" stroke-width="8" stroke-linecap="round" stroke-opacity="0.95"/>
    <g transform="translate(613 750) rotate(-28)">
      <path d="M0 0 L -32 -18 L -32 18 Z" fill="url(#amber)"/>
      <path d="M0 0 L 32 -18 L 32 18 Z" fill="url(#amberShade)"/>
      <circle r="6.5" fill="#F7EFE0"/>
    </g>
    <g transform="translate(597 845) rotate(22)">
      <path d="M0 0 L -28 -16 L -28 16 Z" fill="#F7EFE0"/>
      <path d="M0 0 L 28 -16 L 28 16 Z" fill="url(#paperShade)"/>
      <circle r="6" fill="url(#amber)"/>
    </g>
    <g transform="translate(527 902) rotate(-34)">
      <path d="M0 0 L -25 -14 L -25 14 Z" fill="url(#amber)"/>
      <path d="M0 0 L 25 -14 L 25 14 Z" fill="url(#amberShade)"/>
      <circle r="5.5" fill="#F7EFE0"/>
    </g>
  </g>
  </g>

  <!-- Kite: four facets around the crossing of its spars, tilted into the wind -->
  <g transform="translate(-40 0) rotate(-14 556 430)" filter="url(#kiteShadow)">
    <path d="M556 170 L 366 390 L 556 390 Z" fill="url(#paper)"/>
    <path d="M556 170 L 746 390 L 556 390 Z" fill="url(#paperShade)"/>
    <path d="M366 390 L 556 690 L 556 390 Z" fill="url(#amber)"/>
    <path d="M746 390 L 556 690 L 556 390 Z" fill="url(#amberShade)"/>
    <path d="M556 170 L 556 690 M366 390 L 746 390" stroke="#1E3260" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
    <path d="M556 170 L 746 390 L 556 690 L 366 390 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5" stroke-linejoin="round"/>
    <!-- A Markdown heading mark on the paper: this kite carries a document -->
    <path d="M466 302 L 522 302 M460 334 L 516 334 M488 276 L 478 360 M512 276 L 502 360" stroke="#2F4E86" stroke-opacity="0.9" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
</svg>
